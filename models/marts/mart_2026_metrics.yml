version: 2

models:
  - name: mart_2026_metrics
    description: "Monthly order metrics aggregated from fact_orders. The target year is configurable with the target_year variable."
    columns:
      - name: order_year
        data_type: varchar
        description: "Year of the aggregated orders."
        tests:
          - not_null
      - name: order_month
        data_type: varchar
        description: "Month number of the aggregated orders."
        tests:
          - not_null
      - name: total_orders
        data_type: int
        description: "Number of orders in the year-month."
        tests:
          - not_null
      - name: avg_qty_per_order
        data_type: float
        description: "Average quantity of product units per order in the year-month."
