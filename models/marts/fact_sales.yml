version: 2

models:
  - name: fact_sales
    description: "Sales fact table containing one row per normalized sales line item."
    columns:
      - name: date_date
        data_type: date
        description: "Date on which the sales transaction occurred."
        tests:
          - not_null

      - name: customer_id
        data_type: varchar
        description: "Identifier of the customer associated with the sales line."
        tests:
          - not_null

      - name: order_id
        data_type: varchar
        description: "Identifier of the order associated with the sales line."
        tests:
          - not_null

      - name: products_id
        data_type: varchar
        description: "Identifier of the product sold."
        tests:
          - not_null

      - name: net_sales
        data_type: decimal
        description: "Net sales amount for the sales line."
        tests:
          - not_null

      - name: qty
        data_type: int
        description: "Number of product units sold in the sales line."
        tests:
          - not_null
