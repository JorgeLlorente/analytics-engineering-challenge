version: 2

sources:
  - name: bronze
    description: "Raw data layer ingested into Microsoft Fabric Lakehouse."
    database: "{{ var('bronze_database') }}"
    schema: "{{ var('bronze_schema') }}"
    tables:
      - name: raw_orders
        description: "Raw order header records."
        columns:
          - name: date_date
            data_type: varchar
            description: "Order creation date."
            tests:
              - not_null

          - name: customers_id
            data_type: varchar
            description: "Unique customer identifier."
            tests:
              - not_null

          - name: orders_id
            data_type: varchar
            description: "Unique order identifier."
            tests:
              - not_null

          - name: net_sales
            data_type: varchar
            description: "Total net sales amount for the order."
            tests:
              - not_null